name: Fetch DELTA image

on:
  push:
    branches:
      - S4-produzione

permissions:
  contents: write

jobs:
  fetch-delta-image:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: S4-produzione
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch Wikimedia original
        run: |
          curl --fail --location --retry 3 \
            'https://upload.wikimedia.org/wikipedia/commons/a/ad/DELTA_defence_logo.svg' \
            --output /tmp/delta-logo.svg
      - name: Adapt to 16:9
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          await sharp('/tmp/delta-logo.svg', { density: 300 })
            .resize({
              width: 1600,
              height: 900,
              fit: 'contain',
              position: 'centre',
              background: { r: 0, g: 0, b: 0, alpha: 0 }
            })
            .png({ compressionLevel: 9 })
            .toFile('src/immagini/sistemi/s-delta.png');
          NODE
      - name: Commit asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/immagini/sistemi/s-delta.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'S4: aggiunge logo DELTA 16:9'
          git push origin HEAD:S4-produzione
